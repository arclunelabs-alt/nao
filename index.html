<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nao</title>
<style>
:root {
  --bg: #ffffff;
  --text: #1c1c1e;
  --muted: #6e6e73;
  --line: #e2e2e5;
  --fill: #f2f2f4;
  --accent: #b02a3e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161617; --text: #ececee; --muted: #9a9aa0; --line: #2c2c2f; --fill: #232326; --accent: #e0566a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}
header h1 { margin: 0; font-size: 18px; font-weight: 600; }
header button {
  background: none; border: 0; padding: 4px 0;
  color: var(--muted); font: inherit; font-size: 14px; cursor: pointer;
}
main { flex: 1; overflow-y: auto; padding: 16px; }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--fill); padding: 8px 12px; border-radius: 6px; }
.msg.nao { align-self: flex-start; }
.msg.nao::before { content: "Nao"; display: block; font-size: 13px; font-weight: 600; color: var(--accent); }
.msg.err { color: var(--accent); font-size: 14px; }
.status { color: var(--muted); font-size: 14px; }
.empty { color: var(--muted); margin-top: 24vh; text-align: center; }
form { border-top: 1px solid var(--line); padding: 10px 16px; }
.row { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
textarea {
  flex: 1; resize: none; max-height: 140px;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--text);
  font: inherit; padding: 9px 12px;
}
textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.send {
  border: 0; border-radius: 6px; background: var(--accent); color: #fff;
  font: inherit; font-weight: 600; padding: 10px 16px; cursor: pointer;
}
.send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Nao</h1>
  <button id="clear" type="button">Hapus chat</button>
</header>
<main id="scroll"><div class="wrap" id="log"></div></main>
<form id="form">
  <div class="row">
    <textarea id="input" rows="1" placeholder="Tulis pesan" aria-label="Pesan"></textarea>
    <button class="send" id="send" type="submit">Kirim</button>
  </div>
</form>

<script>
// Isi dua nilai ini dari Supabase: Project Settings > API
const SUPABASE_URL = "https://vqxsbgftithskblymjwa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Ofv4gNIGEyXh6C11aJ2kHg_GZUvnBrv";

const log = document.getElementById("log");
const scroller = document.getElementById("scroll");
const input = document.getElementById("input");
const send = document.getElementById("send");
let history = [];

try { history = JSON.parse(localStorage.getItem("nao-chat") || "[]"); } catch (e) {}
const save = () => { try { localStorage.setItem("nao-chat", JSON.stringify(history.slice(-60))); } catch (e) {} };

function add(role, text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + role + (cls ? " " + cls : "");
  d.textContent = text;
  log.appendChild(d);
  scroller.scrollTop = scroller.scrollHeight;
  return d;
}

function render() {
  log.innerHTML = "";
  if (!history.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "Nao siap membantu. Mau mulai dari mana?";
    log.appendChild(e);
    return;
  }
  history.forEach(m => add(m.role === "user" ? "user" : "nao", m.text));
}

async function submit() {
  const text = input.value.trim();
  if (!text || send.disabled) return;
  if (!history.length) log.innerHTML = "";
  history.push({ role: "user", text });
  add("user", text);
  input.value = "";
  input.style.height = "auto";
  send.disabled = true;
  const status = add("nao", "Nao mengetik…", "status");
  try {
    const res = await fetch(SUPABASE_URL + "/functions/v1/dynamic-service", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "apikey": SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ messages: history.slice(-20) })
    });
    const data = await res.json();
    status.remove();
    if (!res.ok || !data.reply) throw new Error(data.error || "Server tidak membalas");
    history.push({ role: "model", text: data.reply });
    add("nao", data.reply);
    save();
  } catch (e) {
    status.remove();
    history.pop();
    add("nao", "Pesan gagal terkirim: " + e.message + ". Coba kirim lagi.", "err");
    input.value = text;
  }
  send.disabled = false;
  input.focus();
}

document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); submit(); });
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});
document.getElementById("clear").addEventListener("click", () => {
  if (history.length && confirm("Hapus semua chat?")) { history = []; save(); render(); }
});
render();
</script>
</body>
</html>
