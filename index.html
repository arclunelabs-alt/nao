<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f1efe9; --surface:#fbfaf7; --text:#1d1b17; --muted:#756f63; --line:#e2ded3; --fill:#ebe7dc;
  --accent:#8c6a1f; --on-accent:#fff; --err:#b23b30;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0c0b; --surface:#171513; --text:#e9e5dc; --muted:#8d877b; --line:#272421; --fill:#221f1c;
  --accent:#c9a24d; --on-accent:#17130a; --err:#e0705f;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
header h1{margin:0;font:400 30px/1 var(--serif)}
header h1 span{color:var(--accent)}
header button{background:none;border:0;padding:8px 0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;transition:color .15s}
header button:hover{color:var(--text)}
main{flex:1;overflow-y:auto;padding:26px 20px;scroll-behavior:smooth}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.msg{overflow-wrap:anywhere}
.msg.new{animation:in .24s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;max-width:84%;white-space:pre-wrap;background:var(--fill);padding:10px 14px;border-radius:4px}
.msg.nao{align-self:stretch;padding-left:14px;border-left:2px solid var(--accent)}
.msg.nao::before{content:"NAO";display:block;margin-bottom:2px;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--accent)}
.msg.nao p{margin:0 0 .7em}
.msg.nao>*:last-child{margin-bottom:0}
.msg.nao ul,.msg.nao ol{margin:0 0 .7em;padding-left:1.3em}
.msg.nao li{margin:.15em 0}
.msg.nao code{font:500 .88em var(--mono);background:var(--fill);padding:.1em .35em;border-radius:3px}
.msg.nao pre{position:relative;margin:.4em 0 .9em;background:var(--fill);border:1px solid var(--line);border-radius:4px;overflow-x:auto}
.msg.nao pre code{display:block;background:none;padding:14px 16px;font-size:13.5px;line-height:1.6;white-space:pre}
.copy{position:sticky;left:calc(100% - 64px);top:0;float:right;margin:6px 6px 0 0;background:var(--bg);border:1px solid var(--line);color:var(--muted);
  font:inherit;font-size:12px;padding:2px 9px;border-radius:3px;cursor:pointer;transition:color .15s,border-color .15s}
.copy:hover{color:var(--accent);border-color:var(--accent)}
.msg.err{border-left-color:var(--err);color:var(--err);font-size:15px}
.msg.err::before{color:var(--err)}
.dots{display:inline-flex;gap:5px;padding:6px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:b 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,70%,100%{opacity:.25;transform:none}35%{opacity:1;transform:translateY(-3px)}}
.empty{margin-top:20vh;text-align:center;animation:in .6s ease-out both}
.empty b{display:block;font:400 34px/1.15 var(--serif)}
.empty span{display:block;margin-top:8px;color:var(--muted);font-size:15px}
form{border-top:1px solid var(--line);padding:12px 20px 14px}
.row{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:150px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text);
  font:inherit;padding:10px 14px;transition:border-color .15s}
textarea::placeholder{color:var(--muted)}
textarea:focus{outline:none;border-color:var(--accent)}
.send{border:0;border-radius:4px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;padding:11px 20px;cursor:pointer;transition:transform .1s,opacity .15s}
.send:active{transform:scale(.97)}
.send:disabled{opacity:.4;cursor:default}
.send:focus-visible,header button:focus-visible,.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.menu{display:flex;padding:6px;margin-left:-6px;color:var(--text)}
header{justify-content:flex-start;gap:14px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .24s;z-index:10}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);background:var(--bg);border-right:1px solid var(--line);
  transform:translateX(-100%);visibility:hidden;transition:transform .26s ease,visibility 0s .26s;z-index:11;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .drawer{transform:none;visibility:visible;transition-delay:0s}
.new{width:100%;margin-bottom:22px;padding:11px;border:1px solid var(--accent);border-radius:4px;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;transition:background .15s}
.new:hover{background:var(--fill)}
.label{padding:0 10px 6px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#list{flex:1;overflow-y:auto;list-style:none;margin:0;padding:0}
#list li{display:flex;align-items:center;border-left:2px solid transparent;border-radius:0 4px 4px 0}
#list li.active{background:var(--fill);border-left-color:var(--accent)}
#list li.none{color:var(--muted);font-size:14px;padding:8px 10px}
.pick{flex:1;min-width:0;padding:11px 10px;background:none;border:0;color:var(--text);font:inherit;font-size:15px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.del{padding:8px 12px;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;transition:color .15s}
.del:hover{color:var(--err)}
.pick:focus-visible,.del:focus-visible,.new:focus-visible,.menu:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
header,form{background:var(--surface)}
.msg.user{border-radius:18px 18px 4px 18px;padding:10px 16px}
.msg.nao{background:var(--surface);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 16px}
.msg.err{border-color:var(--err)}
.msg.nao pre{background:var(--bg);border-radius:10px}
.copy{background:var(--surface);border-radius:6px}
textarea{border-radius:18px;padding:11px 16px}
.send{border-radius:18px;padding:11px 22px}
.drawer{background:var(--surface);border-radius:0 22px 22px 0}
.new{border-radius:14px}
#list li,#list li.active{border-left:0;border-radius:12px}
.menu{border-radius:10px}
</style>
</head>
<body>
<header>
  <button class="menu" id="menu" type="button" aria-label="Buka daftar chat" aria-expanded="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
  </button>
  <h1>Nao<span>.</span></h1>
</header>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Daftar chat" aria-hidden="true">
  <button class="new" id="new" type="button">Chat baru</button>
  <div class="label">Terbaru</div>
  <ul id="list"></ul>
</aside>
<main id="scroll"><div class="wrap" id="log"></div></main>
<form id="form">
  <div class="row">
    <textarea id="input" rows="1" placeholder="Tulis pesan ke Nao" aria-label="Pesan"></textarea>
    <button class="send" id="send" type="submit">Kirim</button>
  </div>
</form>

<script>
const SUPABASE_URL = "https://vqxsbgftithskblymjwa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Ofv4gNIGEyXh6C11aJ2kHg_GZUvnBrv";

const log = document.getElementById("log");
const scroller = document.getElementById("scroll");
const input = document.getElementById("input");
const send = document.getElementById("send");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let chats = [], cur = null, history = [], busy = false;
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
try {
  const s = JSON.parse(localStorage.getItem("nao-chats") || "null");
  if (s) { chats = s.chats || []; cur = s.cur; }
  else {
    const old = JSON.parse(localStorage.getItem("nao-chat") || "[]");
    if (old.length) { const c = { id: uid(), title: old[0].text.slice(0, 40), updated: Date.now(), messages: old }; chats = [c]; cur = c.id; }
  }
} catch (e) {}
const chatNow = () => chats.find(c => c.id === cur);
history = chatNow() ? chatNow().messages : [];
const save = () => { try { localStorage.setItem("nao-chats", JSON.stringify({ chats: chats.slice(0, 50).map(c => ({ ...c, messages: c.messages.slice(-60) })), cur })); } catch (e) {} };

/* ---------- markdown ringan ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inline = t => esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
function blocks(text) {
  let out = "", para = [], list = null;
  const endPara = () => { if (para.length) out += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; };
  const endList = () => { if (list) out += "</" + list + ">"; list = null; };
  for (const line of text.split("\n")) {
    let m;
    if ((m = line.match(/^\s*[-*]\s+(.*)/))) { endPara(); if (list !== "ul") { endList(); out += "<ul>"; list = "ul"; } out += "<li>" + inline(m[1]) + "</li>"; }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { endPara(); if (list !== "ol") { endList(); out += "<ol>"; list = "ol"; } out += "<li>" + inline(m[1]) + "</li>"; }
    else if (!line.trim()) { endPara(); endList(); }
    else if ((m = line.match(/^#{1,6}\s+(.*)/))) { endPara(); endList(); out += "<p><strong>" + inline(m[1]) + "</strong></p>"; }
    else { endList(); para.push(line); }
  }
  endPara(); endList();
  return out;
}
function md(src) {
  return src.split("```").map((part, i) => {
    if (i % 2 === 0) return blocks(part);
    const code = part.replace(/^[\w+#.-]*\n/, "").replace(/\n$/, "");
    return '<pre><button class="copy" type="button">Salin</button><code>' + esc(code) + "</code></pre>";
  }).join("");
}

/* ---------- UI ---------- */
const near = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120;
const down = () => { scroller.scrollTop = scroller.scrollHeight; };

function add(role, text, cls, fresh) {
  const d = document.createElement("div");
  d.className = "msg " + role + (cls ? " " + cls : "") + (fresh ? " new" : "");
  if (role === "nao" && !cls) d.innerHTML = md(text); else d.textContent = text;
  log.appendChild(d);
  down();
  return d;
}

function reveal(el, text) {
  if (reduce) { el.innerHTML = md(text); down(); return Promise.resolve(); }
  return new Promise(done => {
    const step = Math.max(2, Math.ceil(text.length / 90));
    let i = 0;
    const tick = () => {
      i = Math.min(text.length, i + step);
      const stick = near();
      el.innerHTML = md(text.slice(0, i));
      if (stick) down();
      if (i < text.length) setTimeout(tick, 16); else done();
    };
    tick();
  });
}

function greeting() {
  const h = new Date().getHours();
  return h < 11 ? "Pagi." : h < 15 ? "Siang." : h < 19 ? "Sore." : "Malam.";
}

function render() {
  log.innerHTML = "";
  if (!history.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = "<b>" + greeting() + "</b><span>Ada yang bisa Nao bantu?</span>";
    log.appendChild(e);
    return;
  }
  history.forEach(m => add(m.role === "user" ? "user" : "nao", m.text));
}

async function submit() {
  const text = input.value.trim();
  if (!text || send.disabled) return;
  if (!chatNow()) {
    const c = { id: uid(), title: text.slice(0, 40), updated: Date.now(), messages: [] };
    chats.unshift(c); cur = c.id; history = c.messages; renderList();
  }
  if (!history.length) log.innerHTML = "";
  chatNow().updated = Date.now();
  busy = true;
  history.push({ role: "user", text });
  add("user", text, "", true);
  input.value = ""; input.style.height = "auto";
  send.disabled = true;
  const wait = add("nao", "", "status", true);
  wait.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  try {
    const res = await fetch(SUPABASE_URL + "/functions/v1/dynamic-service", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_ANON_KEY, "apikey": SUPABASE_ANON_KEY },
      body: JSON.stringify({ messages: history.slice(-20) })
    });
    const data = await res.json();
    if (!res.ok || !data.reply) throw new Error(data.error || "Server tidak membalas");
    history.push({ role: "model", text: data.reply });
    save();
    wait.className = "msg nao";
    await reveal(wait, data.reply);
  } catch (e) {
    history.pop();
    if (!history.length) { chats = chats.filter(c => c.id !== cur); cur = null; }
    wait.className = "msg nao err";
    wait.textContent = "Pesan gagal terkirim: " + e.message + ". Coba kirim lagi.";
    input.value = text;
  }
  busy = false;
  send.disabled = false;
  renderList();
  input.focus();
}

document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); submit(); });
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 150) + "px"; });
const menu = document.getElementById("menu"), list = document.getElementById("list");
function setDrawer(open) {
  document.body.classList.toggle("open", open);
  menu.setAttribute("aria-expanded", open);
  document.getElementById("drawer").setAttribute("aria-hidden", !open);
}
function renderList() {
  list.innerHTML = "";
  if (!chats.length) { const n = document.createElement("li"); n.className = "none"; n.textContent = "Belum ada chat"; list.appendChild(n); return; }
  [...chats].sort((a, b) => b.updated - a.updated).forEach(c => {
    const li = document.createElement("li");
    if (c.id === cur) li.className = "active";
    const pick = document.createElement("button");
    pick.className = "pick"; pick.type = "button"; pick.textContent = c.title || "Chat baru";
    pick.onclick = () => openChat(c.id);
    const del = document.createElement("button");
    del.className = "del"; del.type = "button"; del.textContent = "\u00d7"; del.setAttribute("aria-label", "Hapus chat");
    del.onclick = () => removeChat(c.id);
    li.append(pick, del); list.appendChild(li);
  });
}
function openChat(id) {
  if (busy) return;
  cur = id; history = chatNow() ? chatNow().messages : [];
  save(); render(); renderList(); setDrawer(false); down();
}
function newChat() {
  if (busy) return;
  cur = null; history = []; save(); render(); renderList(); setDrawer(false);
}
function removeChat(id) {
  if (busy || !confirm("Hapus chat ini?")) return;
  chats = chats.filter(c => c.id !== id);
  if (cur === id) { cur = null; history = []; render(); }
  save(); renderList();
}
menu.addEventListener("click", () => setDrawer(!document.body.classList.contains("open")));
document.getElementById("scrim").addEventListener("click", () => setDrawer(false));
document.getElementById("new").addEventListener("click", newChat);
document.addEventListener("keydown", e => { if (e.key === "Escape") setDrawer(false); });
let tx = null;
document.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, open = document.body.classList.contains("open");
  if (!open && tx < 24 && dx > 70) setDrawer(true);
  if (open && dx < -70) setDrawer(false);
  tx = null;
}, { passive: true });
log.addEventListener("click", e => {
  const b = e.target.closest(".copy");
  if (!b) return;
  const code = b.parentElement.querySelector("code").textContent;
  const ok = () => { b.textContent = "Tersalin"; setTimeout(() => b.textContent = "Salin", 1500); };
  (navigator.clipboard ? navigator.clipboard.writeText(code).then(ok) : Promise.reject()).catch(() => {
    const t = document.createElement("textarea"); t.value = code; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); ok(); } catch (_) {} t.remove();
  });
});
render(); renderList();
</script>
</body>
</html>
